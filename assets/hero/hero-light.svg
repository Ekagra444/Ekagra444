<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="980"
  height="520"
  viewBox="0 0 980 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">
    Ekagra Agrawal — animated ASCII portrait
  </title>

  <desc id="desc">
    A monochrome terminal-style ASCII portrait with
    a rolling scan reveal.
  </desc>

  <defs>

    <style>
      .frame {
        fill: #F6F8FA;
        stroke: #D0D7DE;
        stroke-width: 1;
      }

      .ascii {
        fill: #15202B;
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          monospace;
        font-size: 7.65px;
        font-weight: 500;
        letter-spacing: 0.05px;
        white-space: pre;
      }

      .muted {
        fill: #57606A;
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;
        font-size: 12px;
      }

      .accent {
        fill: #0969DA;
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;
        font-size: 12px;
        font-weight: 700;
      }
    </style>


    <!-- =========================================================
         SCANNER GRADIENT
         ========================================================= -->

    <linearGradient
      id="scan"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0"
        stop-color="#0969DA"
        stop-opacity="0"
      />

      <stop
        offset="0.40"
        stop-color="#0969DA"
        stop-opacity="0.12"
      />

      <stop
        offset="0.50"
        stop-color="#0969DA"
        stop-opacity="0.75"
      />

      <stop
        offset="0.60"
        stop-color="#0969DA"
        stop-opacity="0.12"
      />

      <stop
        offset="1"
        stop-color="#0969DA"
        stop-opacity="0"
      />
    </linearGradient>


    <!-- =========================================================
         PORTRAIT REVEAL / ERASE MASK

         Timeline:

         0%   -> width 0
         42%  -> width 510   (fully revealed)
         50%  -> width 510   (pause)
         92%  -> width 0     (fully erased)
         100% -> width 0
         ========================================================= -->

    <mask id="roll-mask">

      <!-- Entire portrait starts hidden -->
      <rect
        x="24"
        y="24"
        width="510"
        height="455"
        fill="black"
      />

      <!-- White region = visible portrait -->
      <rect
        x="24"
        y="24"
        width="0"
        height="455"
        fill="white"
      >
        <animate
          attributeName="width"
          values="0;510;510;0;0"
          keyTimes="0;0.42;0.50;0.92;1"
          dur="15s"
          repeatCount="indefinite"
        />
      </rect>

    </mask>


    <!-- Clips the actual portrait -->
    <clipPath id="portrait-clip">
      <rect
        x="24"
        y="24"
        width="510"
        height="455"
        rx="10"
      />
    </clipPath>


    <!-- Scanner can cover the ENTIRE card -->
    <clipPath id="scanner-clip">
      <rect
        x="1"
        y="1"
        width="978"
        height="518"
        rx="14"
      />
    </clipPath>

  </defs>


  <!-- =========================================================
       OUTER CARD
       ========================================================= -->

  <rect
    class="frame"
    x="1"
    y="1"
    width="978"
    height="518"
    rx="14"
  />


  <!-- =========================================================
       TERMINAL HEADER
       ========================================================= -->

  <text
    x="24"
    y="22"
    class="muted"
  >
    ekagra@github:~$ ./profile --portrait
  </text>

  <text
    x="836"
    y="22"
    class="muted"
  >
    PROFILE
  </text>

  <circle
    cx="920"
    cy="18"
    r="4"
    fill="#0969DA"
  />


  <!-- =========================================================
       PORTRAIT
       ========================================================= -->

  <g clip-path="url(#portrait-clip)">

    <rect
      x="24"
      y="24"
      width="510"
      height="455"
      fill="#F6F8FA"
    />

